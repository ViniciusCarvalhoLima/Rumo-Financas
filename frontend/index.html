<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="SaaS Financeiro — controle de rendas, gastos e simulações de investimento com persistência local."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>SaaS Financeiro — Controle Financeiro</title>
    <script>
      // Aplica o tema salvo antes da renderização para evitar "flash" de tema.
      (function () {
        try {
          var salvo = localStorage.getItem("tema-saas-financeiro");
          var escuro =
            salvo === "claro" || salvo === "escuro"
              ? salvo === "escuro"
              : window.matchMedia("(prefers-color-scheme: dark)").matches;
          var el = document.documentElement;
          el.dataset.tema = escuro ? "escuro" : "claro";
          el.style.colorScheme = escuro ? "dark" : "light";
        } catch (e) {
          /* localStorage indisponível — mantém o tema padrão */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
